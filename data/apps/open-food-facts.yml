      * 7511 - edit folksonomy means just value edit ([#7512](https://github.com/openfoodfacts/smooth-app/issues/7512)) ([23d4692](https://github.com/openfoodfacts/smooth-app/commit/23d46923b664e8e313281d698329a5c4dad41a93))
