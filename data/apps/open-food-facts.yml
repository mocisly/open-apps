      * 7379 - currency fix decimals for prices ([#7416](https://github.com/openfoodfacts/smooth-app/issues/7416)) ([5a76910](https://github.com/openfoodfacts/smooth-app/commit/5a76910c0df94ded06621bd60cb6421331590b04))
