    body: "## About\r

      \r

      After a few years, a new version is finally here!\r

      \r

      The most requested features such as portrait movies and photo support are finally available.
      Many other fixes and changes listed below.\r

      \r

      This release wouldn't happen without the amazing work of @TerenceAbigail, which I am very,
      very thankful for all the help.\r

      \r

      iOS support is also done (thanks to @alexis-morain) and I plan to release it on App Store next
      month together with v2.0 (which is gonna be a complete UI rewrite, improving visuals and
      experience).\r

      \r

      Please report any issues you might face and I will try to fix ASAP. Enjoy!\r

      \r

      Note: If you installed the app via PlayStore, please update it there. Don't install these APKs
      over the Play Store version. Otherwise, if your phone was made in 2017 or later, you most
      likely want ```one-second-diary-v1.7.0-arm64-v8a-release.apk```. If it doesn't install, use
      ```one-second-diary-v1.7.0-universal-release.apk```, which works on all devices but is
      larger.\r

      \r

      ## What's Changed\r

      * Option for using persistent notifications by @AdrasteonDev in
      https://github.com/KyleKun/one_second_diary/pull/107\r

      * Fix flutter analyze by @AdrasteonDev in
      https://github.com/KyleKun/one_second_diary/pull/108\r

      * Catalan localization by @KyleKun in https://github.com/KyleKun/one_second_diary/pull/115\r

      * Update depencies and make updates to bring back parity by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/147\r

      * Fixing action runners and `flutter analyze` by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/149\r

      * Add support for converting photos into daily video entries by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/150\r

      * feat(ios): make the app run on iOS by @alexis-morain in
      https://github.com/KyleKun/one_second_diary/pull/152\r

      * fix(ios): two device-blocking crashes, and main compiles again by @alexis-morain in
      https://github.com/KyleKun/one_second_diary/pull/153\r

      * Fix regression in text jumping around when keyboard open by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/154\r

      * docs: fix the MediaGallery.save contract, and record the iOS device status by @alexis-morain
      in https://github.com/KyleKun/one_second_diary/pull/155\r

      * Adds portrait/vertical video feature by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/158\r

      * Fix profile name validator accepting whitespace-only names by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/157\r

      * Ignore personal agent tooling config by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/156\r

      * Run dart format on repo by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/159\r

      * Adds Belarusian localization by @pavel-miniutka in
      https://github.com/KyleKun/one_second_diary/pull/137\r

      * Upgrading shared_preferences to 2.4.1 by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/160\r

      * Add verbose logging as a perference to help further debug issue 135 by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/161\r

      * Fix issue with seek after video playback ends by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/162\r

      * Add preference where clipping follows uses choice strictly by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/163\r

      * When requesting permissions request photo and video by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/164\r

      * Add quickcut button for 1.5 seconds by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/165\r

      * Add Hungarian localization by @KyleKun in
      https://github.com/KyleKun/one_second_diary/pull/167\r

      * Update Changlog to ready for 1.7.0 release by @TerenceAbigail in
      https://github.com/KyleKun/one_second_diary/pull/166\r

      \r

      ## New Contributors\r

      * @AdrasteonDev made their first contribution in
      https://github.com/KyleKun/one_second_diary/pull/107\r

      * @TerenceAbigail made their first contribution in
      https://github.com/KyleKun/one_second_diary/pull/147\r

      * @alexis-morain made their first contribution in
      https://github.com/KyleKun/one_second_diary/pull/152\r

      * @pavel-miniutka made their first contribution in
      https://github.com/KyleKun/one_second_diary/pull/137\r

      \r

      **Full Changelog**: https://github.com/KyleKun/one_second_diary/compare/v1.5.2...v1.7.0"
