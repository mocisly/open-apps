    body: >-
      ## Changes

      - Fixed "Add photo as video" always failing for HEIC photos (e.g. photos from iPhones or
      received in messages); they're now converted before being turned into a video

      - Videos can now be saved on devices where the preview can't play them: the page says the
      preview isn't available and lets you choose how many seconds to keep from the start

      - Fixed daily reminders arriving at the chosen time in UTC instead of your local time, and
      coming back after being turned off whenever a video was saved

      - The calendar no longer loads the selected day's video twice when it opens

      - Fixed errors logged after saving a video for a past day, and when saving with a fully
      transparent date color

      - Fixed movie creation failing ("Cannot map stream") when a clip was cut from a video exported
      by an editing app, which carries a timecode track


      Note: If you installed the app via PlayStore, please update it there. Don't install these APKs
      over the Play Store version. Otherwise, if your phone was made in 2017 or later, you most
      likely want `one-second-diary-v1.7.5-arm64-v8a-release.apk`. If it doesn't install, use
      `one-second-diary-v1.7.5-universal-release.apk`, which works on all devices but is larger.




      ## What's Changed

      * Release 1.7.5: fix HEIC photos, saving when the preview can't play, reminder times by
      @KyleKun in https://github.com/KyleKun/one_second_diary/pull/178

      * Fix movie creation failing on clips with a timecode track by @KyleKun in
      https://github.com/KyleKun/one_second_diary/pull/179



      **Full Changelog**: https://github.com/KyleKun/one_second_diary/compare/v1.7.4...v1.7.5
