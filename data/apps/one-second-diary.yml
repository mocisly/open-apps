    body: >-
      ## Changes

      - Fixed "Permission denied" error when saving videos or creating movies on some devices after
      updating to v1.7.0

      - Fixed vertical video thumbnails overlapping each other when selecting videos for a movie

      - Fixed duration buttons overflowing the screen when saving a photo as a video

      - Save photo page now matches the save video page design

      - Save photo page now remembers the last selected duration


      Note: If you installed the app via PlayStore, please update it there. Don't install these APKs
      over the Play Store version. Otherwise, if your phone was made in 2017 or later, you most
      likely want `one-second-diary-v1.7.1-arm64-v8a-release.apk`. If it doesn't install, use
      `one-second-diary-v1.7.1-universal-release.apk`, which works on all devices but is larger.




      **Full Changelog**: https://github.com/KyleKun/one_second_diary/compare/v1.7.0...v1.7.1
