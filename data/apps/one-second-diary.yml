    body: >-
      ## Changes

      - Fixed daily reminder notifications never arriving on Android 12 and newer since v1.7.0 (the
      app asked for an exact alarm it had no permission for, so nothing was scheduled); reminders
      are now scheduled as inexact alarms and survive reboots and app updates again


      Note: If you installed the app via PlayStore, please update it there. Don't install these APKs
      over the Play Store version. Otherwise, if your phone was made in 2017 or later, you most
      likely want `one-second-diary-v1.7.4-arm64-v8a-release.apk`. If it doesn't install, use
      `one-second-diary-v1.7.4-universal-release.apk`, which works on all devices but is larger.




      ## What's Changed

      * Release 1.7.3: fix "Permission denied" creating movies, white progress text by @KyleKun in
      https://github.com/KyleKun/one_second_diary/pull/175

      * Fix daily reminder notifications on Android 12+ by @KyleKun in
      https://github.com/KyleKun/one_second_diary/pull/176



      **Full Changelog**: https://github.com/KyleKun/one_second_diary/compare/v1.7.2...v1.7.4
