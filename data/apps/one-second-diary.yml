    body: >-
      ## Changes

      - Fixed the "Include location" option turning itself back on for every new clip after being
      disabled

      - Fixed the calendar jumping back to today when a day's video couldn't be played; it now shows
      an error for that day instead

      - Fixed saving a video failing with an ffmpeg error when the clip couldn't be loaded; the app
      now explains the clip couldn't be loaded instead

      - Movie creation now leaves out clips that can't be read instead of failing the whole movie

      - Fixed movies stopping partway through when a clip had no sound (e.g. a silent gallery video
      saved with v1.5.2); such clips now get a silent audio track

      - Logs now include the app version, device model and Android/iOS version, plus errors that
      were previously not recorded, to help diagnose reports


      Note: If you installed the app via PlayStore, please update it there. Don't install these APKs
      over the Play Store version. Otherwise, if your phone was made in 2017 or later, you most
      likely want `one-second-diary-v1.7.2-arm64-v8a-release.apk`. If it doesn't install, use
      `one-second-diary-v1.7.2-universal-release.apk`, which works on all devices but is larger.




      ## What's Changed

      * Fix issue #169 by @TerenceAbigail in https://github.com/KyleKun/one_second_diary/pull/170

      * Release 1.7.2: fix calendar bouncing to today, guard broken saves, fix movies stopping
      partway by @KyleKun in https://github.com/KyleKun/one_second_diary/pull/171

      * Add the 1.7.2 strings to the other ten languages by @KyleKun in
      https://github.com/KyleKun/one_second_diary/pull/172

      * Keep the intro buttons above the Android navigation bar by @KyleKun in
      https://github.com/KyleKun/one_second_diary/pull/174



      **Full Changelog**: https://github.com/KyleKun/one_second_diary/compare/v1.7.1...v1.7.2
