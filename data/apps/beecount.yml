    body: |+
      ## 3.8.6 更新说明

      ### 新功能

      - **首页长按复制交易**：长按支出、收入或转账，选择「复制」，自动带入金额、分类、账户、备注、标签、币种和统计/预算标记。日期默认为当前时间，可在保存前修改；保存后生成独立新交易，原记录不变。
      - 复制时不带入原记录的图片附件；新交易可以重新添加自己的凭证。取消编辑不会创建记录。

      ### 修复

      - 分类同步保留稳定的父子关联，避免父分类改名后子分类丢失。
      - 已有附件的显示顺序与信息更新正确同步，与 Web 端修改保持一致。
      - 补全新建分类图标分组的英文显示。

      ### Cloud 配套升级

      使用自建云时，建议先备份并升级 **BeeCount Cloud 1.7.0**，再升级 App 3.8.6，以获得完整的 Web/MCP 附件能力及同步修复。首页复制交易可在本地账本使用。

      官网说明：[基础记账](https://count.beejz.com/docs/record/basic#复制交易) · [交易附件](https://count.beejz.com/docs/record/attachment)

      ---


