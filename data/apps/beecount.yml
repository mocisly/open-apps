    body: |
      # BeeCount 3.9.0

      - **可分享的交易小票**：长按首页明细选择「生成小票」，预览图片、自选展示备注/标签/账户/账本，再保存或分享。
      - **账户与信用卡体验**：当前欠款和溢缴款分开录入，统一还款方向、正负号与各页面金额口径；账户详情新增全部流水。
      - **外币导入**：改进账户币种推断、匹配与同名多币种处理。
      - **附件刷新**：修复手动同步后附件入口没有及时刷新的问题。
      - **通知角标**：修复 iOS 与 Android 打开或返回 App 后角标残留，保留后续提醒。
      - **多语言**：完善界面本地化显示。

      App 本地功能可独立使用；使用 BeeCount Cloud 时建议先升级服务端至 1.8.0，以取得配套的 Web 账户体验和票据墙。

      源码范围：`3.8.6..3fddb41747d5e6d89df82a2ff493f2f56a5ac37b`。完整提交与安装包信息由发布流水线保留在下方。

      ---

      ## 变更记录
      - fix: 修复 iOS 与 Android 通知角标残留 ([3fddb41](https://github.com/TNT-Likely/BeeCount/commit/3fddb41747d5e6d89df82a2ff493f2f56a5ac37b)) [@TNT-Likely](https://github.com/TNT-Likely)
      - refactor(ai): 获取 API Key 直接跳转 cfg.beejz.com/invite,移除邀请链接池 (#568) ([a09752f](https://github.com/TNT-Likely/BeeCount/commit/a09752fab3d31724b642f3635c88c240ba72ab95)) [@TNT-Likely](https://github.com/TNT-Likely)
      - feat(receipt): 支持交易长按生成可分享小票 (#563) ([5484496](https://github.com/TNT-Likely/BeeCount/commit/54844964ed6ae88158b6a408894e3787b290dd33)) [@TNT-Likely](https://github.com/TNT-Likely)
      - docs(qa): 合并后完整清理隔离验收资源 (#562) ([87bcfcf](https://github.com/TNT-Likely/BeeCount/commit/87bcfcf3cd214a4ae0a2d603700bc89ff92556e6)) [@TNT-Likely](https://github.com/TNT-Likely)
      - fix(sync): 修复手动同步后附件预览入口不刷新 (#561) ([66ca262](https://github.com/TNT-Likely/BeeCount/commit/66ca262b3c09f382b6f85cb3ab69dbce5e778c47)) [@TNT-Likely](https://github.com/TNT-Likely)
      - fix(accounts): 统一账户欠款、流水与外币导入口径 (#554) ([af23731](https://github.com/TNT-Likely/BeeCount/commit/af237312cede9703f4bbe1c410dac4b2ad6498d4)) [@TNT-Likely](https://github.com/TNT-Likely)
      - docs: 完善捐赠名单并按累计金额排序 (#560) ([721177d](https://github.com/TNT-Likely/BeeCount/commit/721177db7eb5daf223ae7609ad93221fba6e2b25)) [@TNT-Likely](https://github.com/TNT-Likely)
