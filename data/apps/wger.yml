    body: >-
      <!-- Release notes generated using configuration in .github/release.yml at 2.1.0 -->


      ## What's Changed

      ### Features

      * feat(measurements): measurement charts and metric type selection #1247 by @pankaj-basnet in
      https://github.com/wger-project/flutter/pull/1251

      * feat(measurements): implement drag-and-drop category reordering (#1258) by @pankaj-basnet in
      https://github.com/wger-project/flutter/pull/1261

      * test(measurements): add unit tests for chart rendering and multi-value category cards
      (#1251) by @pankaj-basnet in https://github.com/wger-project/flutter/pull/1266

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1333

      * Prepare iOS health release requirements by @peter9teufel in
      https://github.com/wger-project/flutter/pull/1337

      * Release 2.7 by @rolandgeider in https://github.com/wger-project/flutter/pull/1319

      * fix(sessions): resolve cross-midnight split bug by migrating to full DateTime
      (wger-project/wger#2379) by @pankaj-basnet in
      https://github.com/wger-project/flutter/pull/1248

      * WIP: health sync by @rolandgeider in https://github.com/wger-project/flutter/pull/1260

      * Remove old API token exchange by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1309

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1334



      **Full Changelog**: https://github.com/wger-project/flutter/compare/2.0.5...2.1.0
