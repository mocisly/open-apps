    body: >-
      <!-- Release notes generated using configuration in .github/release.yml at 2.0.3 -->


      ## What's Changed

      ### Features

      * Fix crash when copying a log with no hydrated exercise by @MatzHilven in
      https://github.com/wger-project/flutter/pull/1287

      * More intelligent powersync service URL handling by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1288

      ### Dependencies

      * Bump build_runner from 2.15.0 to 2.15.1 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1285

      * Bump drift from 2.34.0 to 2.34.2 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1284

      * Bump video_player from 2.12.0 to 2.13.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1282

      * Bump connectivity_plus from 7.2.0 to 7.3.1 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1283

      * Bump powersync from 2.3.1 to 2.3.2 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1281


      ## New Contributors

      * @MatzHilven made their first contribution in
      https://github.com/wger-project/flutter/pull/1287


      **Full Changelog**: https://github.com/wger-project/flutter/compare/2.0.2...2.0.3
