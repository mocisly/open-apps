    body: >-
      <!-- Release notes generated using configuration in .github/release.yml at 2.0.4 -->


      ## What's Changed

      ### Features

      * Improve sync logging and reporting by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1292

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1291

      * feat(auth): allow connecting to servers with self-signed certificates by @bhavit04 in
      https://github.com/wger-project/flutter/pull/1232

      * Default weight profile by @rolandgeider in https://github.com/wger-project/flutter/pull/1227

      * WIP: Default weight using profile by @jmccaull in
      https://github.com/wger-project/flutter/pull/1207

      * feat : implemented dynamic colour support by @Praharsha2007 in
      https://github.com/wger-project/flutter/pull/1301

      * Fix user profile is unavailable with PowerSync by @Sanji78 in
      https://github.com/wger-project/flutter/pull/1306

      * Better (powersync) logging by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1307

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1295

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1311

      ### Dependencies

      * Bump powersync from 2.3.2 to 2.3.3 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1299

      * Bump extended_image from 10.0.1 to 10.1.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1298

      * Bump json_serializable from 6.14.0 to 6.14.1 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1296

      * Bump drift from 2.34.2 to 2.34.3 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1297

      * Bump json from 2.21.1 to 2.21.2 in /ios by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1305

      * Bump flutter_secure_storage from 10.3.1 to 11.0.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1308


      ## New Contributors

      * @bhavit04 made their first contribution in https://github.com/wger-project/flutter/pull/1232

      * @jmccaull made their first contribution in https://github.com/wger-project/flutter/pull/1207

      * @Praharsha2007 made their first contribution in
      https://github.com/wger-project/flutter/pull/1301

      * @Sanji78 made their first contribution in https://github.com/wger-project/flutter/pull/1306


