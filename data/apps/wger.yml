      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1346

      * upgrade flutter to 3.47 (#1316) by @pankaj-basnet in
      https://github.com/wger-project/flutter/pull/1347

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1381

      ### Dependencies

      * Bump drift from 2.34.3 to 2.34.4 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1355

      * Bump stream_transform from 2.1.1 to 2.1.2 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1357

      * Bump flutter_zxing from 2.3.0 to 3.0.1 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1358

      * Bump image from 4.9.2 to 4.10.1 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1373

      * Bump rubyzip from 2.4.1 to 3.4.0 in /ios by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1377

      * Bump powersync from 2.3.3 to 2.4.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1364

      * Bump dynamic_color from 1.9.0 to 2.1.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1332

      * Bump freezed from 3.2.6-dev.1 to 4.0.2 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1356

      * Bump clock from 1.1.2 to 1.1.3 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1363

      * Bump flutter_secure_storage from 11.0.0 to 11.2.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1379

