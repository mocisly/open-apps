      <!-- Release notes generated using configuration in .github/release.yml at 2.0.5 -->


      ## What's Changed

      ### Features

      * fix(auth): do not await PowerSync disconnect during session clear by @bentucker in
      https://github.com/wger-project/flutter/pull/1313

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1318

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1328

      * Better online gating by @rolandgeider in https://github.com/wger-project/flutter/pull/1327

      * fix(core): make UI side effects and provider reads safe during build by @bentucker in
      https://github.com/wger-project/flutter/pull/1322

      * Handle duplicate muscles on muscle overview by @charugupta-dev in
      https://github.com/wger-project/flutter/pull/1326

      ### Dependencies

      * Bump video_player from 2.13.0 to 2.14.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1325


      ## New Contributors

      * @bentucker made their first contribution in
      https://github.com/wger-project/flutter/pull/1313

      * @charugupta-dev made their first contribution in
      https://github.com/wger-project/flutter/pull/1326


      **Full Changelog**: https://github.com/wger-project/flutter/compare/2.0.4...2.0.5
