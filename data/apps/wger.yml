    body: >-
      <!-- Release notes generated using configuration in .github/release.yml at 2.0.2 -->


      ## What's Changed

      ### Features

      * Folder restructuring by @rolandgeider in https://github.com/wger-project/flutter/pull/1249

      * feat(gym-mode): add logs history scope and deduplication controls (#1240) by @pankaj-basnet
      in https://github.com/wger-project/flutter/pull/1256

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1234

      * fix: make routineId nullable to prevent crash on free workout logs by @mmustafasenoglu in
      https://github.com/wger-project/flutter/pull/1257

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1269

      * Add elapsed workout timer to gym mode by @Arya-185 in
      https://github.com/wger-project/flutter/pull/1276

      ### Dependencies

      * Bump actions/checkout from 6 to 7 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1226

      * Bump package_info_plus from 10.1.0 to 10.2.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1241

      * Bump connectivity_plus from 7.1.1 to 7.2.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1242

      * Bump powersync from 2.3.0 to 2.3.1 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1243

      * Bump equatable from 2.0.8 to 2.1.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1254

      * Bump app_links from 7.1.2 to 7.2.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1253

      * Bump video_player from 2.11.1 to 2.12.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1268

      * Bump package_info_plus from 10.2.0 to 10.2.1 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1272

      * Bump app_links from 7.2.0 to 7.2.1 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1267

      * Bump image_picker from 1.2.2 to 1.2.3 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1252

      * Bump faraday from 1.10.5 to 1.10.6 in /ios by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1246

      * Bump excon from 0.112.0 to 1.5.0 in /ios by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1277


      ## New Contributors

      * @mmustafasenoglu made their first contribution in
      https://github.com/wger-project/flutter/pull/1257

      * @Arya-185 made their first contribution in https://github.com/wger-project/flutter/pull/1276


      **Full Changelog**: https://github.com/wger-project/flutter/compare/2.0.1...2.0.2
