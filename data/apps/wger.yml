    body: >-
      <!-- Release notes generated using configuration in .github/release.yml at 2.1.2 -->


      ## What's Changed

      ### Features

      * Use Health Connect's daily totals for steps, distance and active energy by @strobeskinzzz in
      https://github.com/wger-project/flutter/pull/1391

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1388

      * Gym mode: add optional sticky set values by @BrianHotopp in
      https://github.com/wger-project/flutter/pull/1290

      * Gym mode: show upcoming set on timer pages, fix editing logged sets, persist rest timers by
      @BrianHotopp in https://github.com/wger-project/flutter/pull/1289

      * Don't lose a workout in gym mode when leaving it or when the app is killed by @andratwiro in
      https://github.com/wger-project/flutter/pull/1280

      * Add notifications while the app is in gym mode by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1405

      ### Dependencies

      * Bump shared_preferences from 2.5.5 to 2.5.6 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1396

      * Bump drift from 2.35.1 to 2.35.2 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1394

      * Bump build_runner from 2.16.1 to 2.16.2 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1392

      * Bump material_ui from 1.5.0 to 1.6.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1393

      * Bump cupertino_icons from 1.0.9 to 2.0.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1395

      * Bump fl_chart from 1.2.0 to 1.3.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1403

      * Bump equatable from 2.1.0 to 3.0.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1402


      ## New Contributors

      * @strobeskinzzz made their first contribution in
      https://github.com/wger-project/flutter/pull/1391

      * @BrianHotopp made their first contribution in
      https://github.com/wger-project/flutter/pull/1290

      * @andratwiro made their first contribution in
      https://github.com/wger-project/flutter/pull/1280


      **Full Changelog**: https://github.com/wger-project/flutter/compare/2.1.1...2.1.2
