    body: "## What's Changed\r

      \r

      * feat: add tabular numbers by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7568\r

      * fix: render mentions, emojis, and inline elements inside headings by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/6911\r

      * fix: ISO format support in markdown component by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/6943\r

      * fix: resolve deep links by room id for channels and groups by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7111\r

      * fix: crop screen hidden behind navigation bar on iOS 26 by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7529\r

      * fix: UIKit block messages rendering with smaller font size by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7531\r

      * fix(iOS): RoomItem Swipe not working after scroll by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7532\r

      * fix(android): VideoConf notification accept and decline button hidden and touch not working
      by @OtavioStasiak in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7533\r

      * fix: quote has no effect on older thread messages by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7535\r

      * fix: delete background taller than its row on ServersHistory by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7536\r

      * fix: Admin Panel content hidden behind bottom navigation bar by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7538\r

      * fix(db): move sendMessage reads and prepares inside the writer lock by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7546\r

      * fix(db): move decryptPendingMessages prepares inside the writer lock by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7548\r

      * fix(db): move deleteMessage finds and prepares inside the writer lock by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7550\r

      * fix(db): move persistMessage lookups and prepares inside the writer lock by @OtavioStasiak
      in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7551\r

      * fix: run handleDelete finds and prepares inside the writer lock by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7552\r

      * fix(e2ee): re-fetch subscription inside the write in toggleRoomE2EE by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7554\r

      * fix(ci): select shards for changes outside app and honor the release label by @diegolmello
      in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7555\r

      * fix: re-fetch message inside the write in getThreadName by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7557\r

      * fix: test case 11 and 12 flaky tests by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7564\r

      * fix: force Google account chooser on OAuth login by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7572\r

      * fix: UIKit buttons not responding on some Android devices by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7573\r

      * fix: grant pull-requests write to build call sites in build-develop by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7599\r

      * chore(ci): apply least privilege permission to GitHub Actions by @yasnagat in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7350\r

      * chore: OXC by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7515\r

      * chore: migrate typecheck to TypeScript 7.0 by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7516\r

      * chore: Bump version to 4.76.0 by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7542\r

      * chore: switch React Compiler to infer mode by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7545\r

      * chore: pin @rocket.chat/sdk to a specific commit hash by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7569\r

      * ci: route Maestro e2e selection through sniffler impact analysis by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7476\r

      \r

      **Full Changelog**:
      https://github.com/RocketChat/Rocket.Chat.ReactNative/compare/4.75.0...4.76.0\r\n"
