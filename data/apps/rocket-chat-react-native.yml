    body: "## What's Changed\r

      \r

      * feat: Authentication bypass via biometric enrollment change by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7351\r

      * feat: floating date separator by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7588\r

      * feat: render custom sidebar categories in rooms list by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7734\r

      * fix(android): remove extra header height in NewServerView by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7432\r

      * fix(security): harden Android notification receivers, token storage, and deep-link login by
      @OtavioStasiak in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7447\r

      * fix: room list rendering wrong built-in emoji when a custom emoji shares its shortcode by
      @Rohit3523 in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7462\r

      * fix: video attachments not reproducing on iOS by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7530\r

      * fix: prepare subscription updates inside the writer lock by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7544\r

      * fix(voip): unblock incoming calls on Android below API 33 by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7579\r

      * fix: crash in ShareView when a shared file no longer exists by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7581\r

      * fix: emojis sent from web not rendering by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7594\r

      * fix: resolved link preview cleared by partial message sync by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7597\r

      * fix: reaction list cuts off last reactors behind the nav bar by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7620\r

      * fix: reactions not displaying on thread main message by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7621\r

      * fix: reaction sheet blank when server omits reaction names by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7622\r

      * fix: UNIQUE constraint failed on threads.id by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7625\r

      * fix: leaked prepared subscriptions break lastOpen writes by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7626\r

      * fix: fewer-hooks crash on NewServerView by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7651\r

      * fix: admin panel requiring a new login by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7665\r

      * fix: allow channel, user and emoji autocomplete after slash command by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7668\r

      * fix(android): E2E not building on CI by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7688\r

      * fix: show stored messages when a room's first load fails by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7736\r

      * regression: custom emoji rendering as raw shortname in reaction bar and emoji picker by
      @OtavioStasiak in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7671\r

      * chore: migrate from expo-av to expo-audio and expo-video by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/6719\r

      * chore: align encrypted option background color and add top margin in create discussion by
      @Rohit3523 in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7254\r

      * chore: update @rocket.chat/sdk to 2.0.0-mobile by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7574\r

      * chore: add oxlint complexity rules by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7610\r

      * chore: Bump version to 4.77.0 by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7617\r

      * chore: remove all import/no-cycle warnings by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7619\r

      * chore: replace react-native-dotenv with transform-inline-environment-variables by @Rohit3523
      in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7646\r

      * chore: add cognitive complexity lint rule by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7652\r

      * chore: unit tests for sendMessages, resendMessages, UpdateMessages and readMessages by
      @OtavioStasiak in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7677\r

      * chore: replace react-native-restart with expo reloadAppAsync by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7684\r

      * chore: replace react-native-background-timer with setInterval by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7685\r

      * chore: bump react-native-localize to 3.7.0 by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7686\r

      * chore: replace react-native-file-viewer with expo-quick-look by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7687\r

      * refactor: migrate RoomView to a function component by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7482\r

      * refactor: replace deep relative imports with application aliases by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7656\r

      * tests: Add CAS and SAML login E2E Test by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7659\r

      * test: e2e encryption banner race and iOS Maestro shard 11 timeout by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7663\r

      * test: add unit tests for buildMessage and normalizeMessage by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7700\r

      * test: add unit test for audio and file upload helpers by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7701\r

      * test: add unit test for MessageComposer audio recording components by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7704\r

      * test: add unit test for getMoreMessages, loadNextMessages and loadSurroundingMessages by
      @Rohit3523 in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7708\r

      * docs: make Workspace the canonical domain term over Server by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7603\r

      \r

      **Full Changelog**:
      https://github.com/RocketChat/Rocket.Chat.ReactNative/compare/4.76.0...4.77.0\r\n"
