    body: "## What's Changed\r

      \r

      * fix: render list separators consistently by snapping row heights to the pixel grid by
      @diegolmello in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7449\r

      * fix: hold keyboard focus on the rooms list for hardware-keyboard navigation by @diegolmello
      in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7467\r

      * fix: ignore user not working reliably on e2e tests by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7469\r

      * fix: re-subscribe room streams after re-authentication on reconnect by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7475\r

      * fix: harden e2e CI against Android ANR dialog and iOS Maestro driver timeout by @diegolmello
      in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7495\r

      * fix: race on concurrent message stream events updating same record by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7493\r

      * fix: reuse stale upload record instead of blocking re-send by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7494\r

      * fix: restore Away status option on servers 8.6.0 and above by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7498\r

      * fix: Guard ActionSheet hide() to skip side effects when not visible by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7509\r

      * fix: UserPreferences.getBool not parsing JSON-string booleans by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7510\r

      * fix(voip): reconnect stale socket before native call accept by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7526\r

      * fix(sync): derive the message sync cursor from the server clock by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7523\r

      * chore: improve spotlight search by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7406\r

      * chore: Bump version to 4.75.0 by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7459\r

      * chore(ios): default to RocketChat scheme by renaming workspace and project by @diegolmello
      in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7433\r

      * chore: migrate mobile-crypto to BouncyCastle on Android by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7461\r

      * chore: add edge-to-edge support on Android by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7157\r

      * chore: adapt CLAUDE.md to Opus 5 with /doctor by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7517\r

      * test: fix delete maestro created users by @jessicaschelly in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7497\r

      * refactor: apply useCustomEmoji by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7472\r

      * refactor: Message component by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7455\r

      * ci: resolve Node from package.json instead of the broken lts/* alias by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7466\r

      * ci: build arm64-v8a alongside x86_64 in the Android E2E APK by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7465\r

      * docs: add CI trigger map for agents by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7445\r

      * revert: roll back SDK socket probing (#7298) and dependent reconnect fixes by @diegolmello
      in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7521\r

      \r

      **Full Changelog**:
      https://github.com/RocketChat/Rocket.Chat.ReactNative/compare/4.74.0...4.75.0"
