    body: "# v3.2.0\r

      Welcome to Immich `v3.2.0`!\r

      \r

      This release includes many new features as well as the usual collection of bug fixes and
      cleanups. Keep reading below for a list of highlights.\r

      \r

      ## Highlights\r

      \r

      * Docker compose builder\r

      * Revamped search UI (web)\r

      * Search API v2 (server)\r

      * View own people in shared assets, cross-user clustering\r

      * Workflow tags trigger and actions\r

      * Dedicated memories page\r

      * Tag renaming (web)\r

      * View assets in map viewport (web)\r

      \r

      ### Docker compose builder\r

      \r

      We recently released our new [docker compose
      builder](https://immich.app/docker-compose-builder), which lets you put together a custom
      compose file for Immich more easily. Please try it out and give us [your
      feedback](https://github.com/immich-app/immich/discussions/31232)!\r

      \r

      ### Search API v2 (server)\r

      \r

      We have built an entirely new search API that, amongst other things, will support searching
      within albums and combining multiple search filters with both AND and OR operations. Some of
      these features will be exposed to the search UI interfaces in the future, others will be used
      to power other fancy features as well as give 3rd party tools more functionality. If you are
      interested in the particular changes and examples for how to use the new API, feel free to
      check out the PR <https://github.com/immich-app/immich/pull/30179> as well as our API
      documentation at <https://api.immich.app/endpoints/search/searchAssets>.\r

      \r

      \r

      ### Revamped search UI (web)\r

      \r

      We have a new designer who helped us remodel the search modal, which has been pretty complex
      before and looks a lot more visually appealing in our opinion now. It still supports the same
      functionality, but with some quality of life additions as well as a significantly simpler
      look. In the future, we will extend this to also include some of the new features enabled by
      the new search API. Stay tuned and give us your feedback on the new design!\r

      \r

      <img alt=\"image\"
      src=\"https://github.com/user-attachments/assets/aa1cf886-498d-4e9f-b7cf-96dcb8300818\" />\r

      \r

      _New search modal filtering by images with Jason in it, taken in the last 30 days in BC,
      Canada, tagged \"Long Beach\" with the context search term \"Swimming\"_\r

      \r

      <img  alt=\"image\"
      src=\"https://github.com/user-attachments/assets/d87e24db-d314-4462-a204-a9a3020c1ddd\" />\r

      \r

      _Advanced filters showing camera make, model, and lens model, as well as filers for favorite
      and archive status, and album membership_\r

      \r

      ### View own people in shared assets\r

      \r

      We are very happy to ship the first step towards better sharing. You can now have people
      recognized across trusted users, which also allows you to view people you already have records
      of in any shared assets!\r

      \r

      In the [user sharing settings](https://my.immich.app/user-settings?isOpen=sharing) there is a
      new section; cluster group.\r

      \r

      <img alt=\"cluster group\"
      src=\"https://github.com/user-attachments/assets/498d914b-40b2-427f-b0ba-04803706772a\" />\r

      \r

      _The user sharing settings showing a cluster group with Jane Doe and Mich in it_\r

      \r

      You can invite users on your instance that you trust to your own group, or join another group
      you have been invited to. These cluster groups make it possible to identify people in assets
      shared by users in the same group. They also likely improve accuracy, as the clustering will
      operate on a bigger pool of faces. People names and birth dates are still set on a per-user
      level and aren’t (yet) shared with users in the same group. \r

      \r

      As of now, this **requires** resetting facial recognition for all users in the group, in order
      for the changes to apply retroactively for all assets. This means, names and birth dates will
      be lost, and the results can vary slightly compared to before. Only faces recognized by
      machine learning will be affected by this. We may be able to do some non-destructive merging
      in the future, but for now this is a necessary step in order to fully benefit from the
      feature. That is why we put a button in the sharing settings for every user in the group
      (specifically also non-admins) to reset the facial recognition for that group.\r

      \r

      ### Workflow tags trigger and actions\r

      \r

      Workflows have gotten a new trigger. You can now do automations when an asset has been
      tagged.\r

      \r

      <p align=\"center\">\r

      <img width=\"400\" alt=\"trigger list\"
      src=\"https://github.com/user-attachments/assets/8d949bce-8ec6-4be2-96a0-5fca1715ae2a\" />\r

      </p>\r

      In order to use this new trigger, there is also a new filter that allows you to match specific
      tags. It supports matching for all, any, or none in the provided list.\r

      \r

      <p align=\"center\">\r

      <img width=\"400\"  alt=\"tag trigger\"
      src=\"https://github.com/user-attachments/assets/91435b14-6ca8-41da-b3d3-73c7704df695\" />\r

      </p>\r

      \r

      Lastly, a new workflow action to add tags to the current asset has also been added. It allows
      to add a list of tags at once.\r

      \r

      <p align=\"center\">\r

      <img  width=\"400\"  alt=\"add tag step\"
      src=\"https://github.com/user-attachments/assets/04910b74-04ee-4564-8b2f-48f3d5e76dbf\" />\r

      </p>\r

      \r

      ### Dedicated memories page\r

      \r

      The new memories page allows you to view past memories. You can also favorite memories and
      they will show up here and never get deleted. The goal is for this to be a place you can come
      back to at any point and reminisce in old memories.\r

      \r

      <p >\r

      <img width=\"600\" alt=\"image\"
      src=\"https://github.com/user-attachments/assets/0f526915-b53a-484e-8d99-ce0caa9698fd\" />\r

      <img width=\"200\" alt=\"Memory page on the mobile app\"
      src=\"https://github.com/user-attachments/assets/b11b8534-22c9-417c-a57b-922bada486c5\" />\r

      </p>\r

      \r

      ### Tag renaming (web)\r

      \r

      Finally, you can also rename existing tags. This is a small addition to the edit tag modal on
      web, but under the hood was more complicated than you might expect. \r

      \r

      <p align=\"center\">\r

      <img width=\"400\" alt=\"tag renaming\"
      src=\"https://github.com/user-attachments/assets/091acef9-1056-4264-9e89-c44d9ddfdbc7\" />\r

      </p>\r

      \r

      ### View assets in map viewport (web)\r

      \r

      Similarly to showing a timeline all assets in a cluster on the map when clicking on it, you
      can now open a timeline for assets currently in the viewport. There is a new button among the
      map controls to show assets in the area. It will open a timeline that will update as you pan
      around the map.\r

      \r

      <img alt=\"map view port with timeline\"
      src=\"https://github.com/user-attachments/assets/90b0aeb5-2e99-4dc5-a8cb-592c3ed71e8f\" />\r

      \r

      _The map page showing a timeline of assets currently in the viewport on the right_\r

      \r

      As always, please consider supporting the project.\r

      \r

      🎉 Cheers! 🎉\r

      \r

      ## Support Immich\r

      \r

      <p align=\"center\">\r

      \r

      <img
      src=\"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbjY2eWc5Y2F0ZW56MmR4aWE0dDhzZXlidXRmYW\
      Zyajl1bWZidXZpcyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/87CKDqErVfMqY/giphy.gif\"
      width=\"450\" title=\"SUPPORT THE PROJECT!\">\r

      \r

      </p>\r

      \r

      \r

      If you find the project helpful, you can support Immich by purchasing a product key at
      <https://buy.immich.app> or our merchandise at <https://immich.store>\r

      \r

      ----\r

      \r

      ## What's Changed\r

