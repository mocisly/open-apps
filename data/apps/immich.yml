    body: "Welcome to Immich `v3.1.0`!\r

      \r

      This release includes several quality of life improvements and another round of bug fixes.
      Keep reading below for the complete highlights.\r

      \r

      ## Highlights\r

      \r

      - Upload wakelock (web)\r

      - Undo archive (web)\r

      - Filter assets by server filepath (workflows)\r

      - Quick navigate to maintenance page (web)\r

      - Better slideshow button accessibility (web)\r

      - OIDC role claim sync improvements (OAuth)\r

      - Invalidate sessions on password reset (admin-cli)\r

      \r

      ### Upload wakelock (web)\r

      \r

      Similar to mobile, the web application will now automatically acquire a wakelock to prevent
      the screen from dimming while uploads are happening. This feature will require an HTTPS
      connection.\r

      \r

      ### Undo archive (web)\r

      \r

      After archiving assets, the success notification now has an “undo” button to undo the
      action.\r

      \r

      ![Undo button on success
      notification](https://static.immich.cloud/blog/48ff8c50-260a-4114-a8a0-117d8989f622/48fe5c007\
      1ecd3700696ea24516267dd.webp)\r

      \r

      ### Filter assets by server filepath (workflows)\r

      \r

      The asset file filter has a new option “Use path”. When set to true, it will filter based on
      the actual path on the server rather than the original file name.\r

      \r

      ![](https://static.immich.cloud/blog/48ff8c50-260a-4114-a8a0-117d8989f622/f75b6701af0ad0acd16\
      f281106e5d571.webp)\r

      \r

      ### Filter assets by EXIF metadata (workflows)\r

      \r

      A new workflow filter has been added that allows you to filter assets based on their EXIF
      metadata fields. For now it only supports string comparisons, with numerical comparisons
      expected to come soon.\r

      \r

      <img width=\"700\" alt=\"Filter by EXIF metadata step configuration options\"
      src=\"https://static.immich.cloud/blog/48ff8c50-260a-4114-a8a0-117d8989f622/10dbcaddcbeb9bfa7\
      cab1e4029e0f70b.webp\" />\r

      \r

      ### Quick navigate to maintenance page (web)\r

      \r

      The command palette (`CTRL+K` or `/`) now includes an item for the maintenance page.\r

      \r

      <img width=\"600\" alt=\"Command palette with a maintenance page item\"
      src=\"https://static.immich.cloud/blog/48ff8c50-260a-4114-a8a0-117d8989f622/28134831c6b1a5f19\
      19ceecdadc1ae54.webp\" />\r

      \r

      ### Better slideshow button visibility (web)\r

      \r

      The slideshow buttons on the web are now wrapped in a container with a backdrop blur, making
      them easier to view when the current asset is very light.\r

      \r

      ![Slideshow controls on a low contrast
      image](https://static.immich.cloud/blog/48ff8c50-260a-4114-a8a0-117d8989f622/496215825fbad61a\
      3b2a0c640b5c3aeb.webp)\r

      \r

      ### OIDC role claim sync improvements (OAuth)\r

      \r

      The OAuth integration in Immich supports setting an initial `isAdmin` value for new users via
      a role claim. This same process has been updated to now _sync_ `isAdmin` on subsequent logins.
      Additionally, the role claim now supports both single values (`immich_role: 'admin'`) in
      addition to lists of values ( `immich_role: [\"admin\", \"user\"]`), making in more
      flexible.\r

      \r

      ### Invalidate sessions on password reset (admin-cli)\r

      \r

      When using the admin command line interface to reset a password, there is now a new option to
      invalidate existing sessions.\r

      \r

      ```none\r

      immich-admin reset-admin-password\r

      Found Admin:\r

      - ID=e65e6f88-2a30-4dbe-8dd9-1885f4889b53\r

      - OAuth ID=\r

      - Email=admin@example.com\r

      - Name=Immich Admin\r

      ? Please choose a new password (optional) immich-is-cool\r

      ? Invalidate existing sessions? Yes\r

      The admin password has been updated.\r

      ```\r

      \r

      ### Date range for map (mobile)\r

      \r

      Similar to web, mobile now also supports filtering the map for assets within a given date
      range.\r

      \r

      <img width=\"500\" alt=\"Mobile map settings page date range options\"
      src=\"https://static.immich.cloud/blog/48ff8c50-260a-4114-a8a0-117d8989f622/be25f538bcb69574f\
      f21c15c2aa64b27.webp\" />\r

      \r

      ---\r

      \r

      <!-- Release notes generated using configuration in .github/release.yml at v3.1.0 -->\r

      \r

