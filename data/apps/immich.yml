    body: "This patch release addresses various bugs, including:\r

      - An issue with connection pool exhaustion during sync\r

      - Problems with the new search modal\r

      - Not seeing partner shared assets on people page\r

      - Person merge not working for two named people\r

      \r

      ... and more. See the full list below.\r

      \r

      <!-- Release notes generated using configuration in .github/release.yml at v3.2.1 -->\r

      \r

      ## What's Changed\r

      ### 🐛 Bug fixes\r

      * fix: show partner assets on people page by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31449\r

      * fix(server): vacuum after migrations, concurrent reindex by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31446\r

      * fix(web): asset remains in timeline after archive by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31459\r

      * fix(web): change \"View asset owners\" to \"Hide asset owners\" when enabled by
      @immich-push-o-matic[bot] in https://github.com/immich-app/immich/pull/31460\r

      * fix(web): preserve search type by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31462\r

      * fix: sync client disconnect by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31463\r

      * fix(web): scroll timeline to top when navigating without a scroll target by
      @immich-push-o-matic[bot] in https://github.com/immich-app/immich/pull/31477\r

      * fix: honor memory filters on explore page by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31542\r

      * fix: face label clipping (again) by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31543\r

      * fix(web): show full path on hover in duplicates utility by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31491\r

      * fix: feature face update ignores soft-deleted faces by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31545\r

      * fix: put back search untagged button by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31546\r

      * fix: reset shouldChangePassword on password change by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31553\r

      * fix: metadata extraction of faces by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31554\r

      * feat: people merge improvements by @immich-push-o-matic[bot] in
      https://github.com/immich-app/immich/pull/31555\r

      \r

      \r

      **Full Changelog**: https://github.com/immich-app/immich/compare/v3.2.0...v3.2.1"
