    body: "# v3.3.0\r

      \r

      > [!NOTE]\r

      > We're collecting feedback related to people sharing in this discussion:
      https://github.com/immich-app/immich/discussions/32196 \r

      \r

      \r

      Welcome to Immich `v3.3.0`!\r

      \r

      This release includes people sharing, birthday memories, auto-stacked mobile edits, and a
      variety of other enhancements and bug fixes. Keep reading below for the full list of
      highlights.\r

      \r

      ## Highlights\r

      \r

      * Shared people management\r

      * Birthday memories\r

      * Auto-stacked mobile edits\r

      * Sync OAuth claims on every login\r

      * Higher quality thumbnails and previews\r

      * Machine learning performance and accuracy improvements (opt-in)\r

      * New OCR models\r

      * Notable fix: correct storage size on MacOS\r

      \r

      ### Shared people management\r

      \r

      We are very pleased to release the next big milestone towards better sharing: people can now
      be shared!\r

      \r

      As a user you can share people with another user in your cluster group:\r

      \r

      ![](https://github.com/user-attachments/assets/b011c1a2-b81c-47a8-b3d8-159d829fcf82 \"
      =428x659\")\r

      \r

      \r

      > [!NOTE]\r

      > The “Manage access” modal can be opened from both the “People” (`/people`) and “Sharing
      settings” (`/user-settings`) pages in the web application. The modal is not available on
      mobile, yet.\r

      \r

      ![](https://github.com/user-attachments/assets/1d302bb6-71ca-481a-893b-9e54897cef5b)\r

      \r

      \r

      When sharing a person with another user, the shared person:\r

      \r

      * Shows up in both users’ list of people (on mobile and web)\r

      * Shows up in the asset viewer / asset detail view on both owned and shared assets\r

      * Can be edited by both users (only the name & birth date fields)\r

      \r

      \r

      \r

      > [!NOTE]\r

      > Person sharing is directional. This means that each user needs to share each person back for
      edits to automatically work in both directions.\r

      \r

      \r

      \r

      By default, changes to the name & date of birth are reflected for both users. On the web, the
      “Edit person” modal has an option to change the name/date of birth for “Only me” instead of
      the whole group.\r

      \r

      ![](https://github.com/user-attachments/assets/f40f0358-27c0-42c2-86c3-0fb8487bfdc2 \"
      =424x431\")\r

      \r

      \r

      Also, there is a preference for this behavior in the “Sharing settings”, which can be changed
      to make this the default behavior when editing a person. The setting can be changed here:[
      https://my.immich.app/user-settings?isOpen=feature+peopl](https://my.immich.app/user-settings\
      ?isOpen=feature+people.)[e](https://my.immich.app/user-settings?isOpen=feature+people). \r

      \r

      ![](https://github.com/user-attachments/assets/75cb4553-d59b-4a7b-b399-17136f2e6f3c \"
      =604x113\")\r

      \r

      \r

      The setting has two options:\r

      \r

      * “Everyone with shared access” — means an update will apply for everyone, covering the
      typical family use case where one or two users are supposed to be responsible for the entire
      family's people.  \r

      * “Only me” — means the names and dates of births will remain unchanged for other users\r

      \r

      \r

      Lastly, by allowing cross-user merging, you can now merge a face from your own assets with
      people shared with you from other users. This is especially helpful if you didn't want to
      re-run facial recognition after joining a cluster group before. Now, after setting up
      bi-directional sharing, users can manually link people together.\r

      \r

      \r

      ### Birthday memories\r

      \r

      In an effort of making Immich more joyful to use, we are introducing memories for people's
      birthdays.\r

      \r

      If it's the birthday of a person in your library, Immich will now celebrate that with a
      special memory featuring previous birthdays.  \r

      \r

      \r

      ![](https://github.com/user-attachments/assets/96c5e974-576e-4d65-b1e8-cdbfe890268b \"
      =1200x534\")\r

      \r

      \r

      ### Auto-stacked mobile edits\r

      \r

      When using something other than Immich for editing images on your phone, Immich will now stack
      those edits on top of the original. This allows for Immich to show all edits in one place,
      without cluttering the timeline. \r

      \r

      This should provide a more organized timeline, especially when you heavily rely on editing
      assets on your phone.\r

      \r

      | ![](https://github.com/user-attachments/assets/372e3770-369e-4fb4-8a4a-98d38225fecd \"
      =259x394\")
      |  ![](https://github.com/user-attachments/assets/235fb7fe-6565-4aef-9f68-8eac34eb6488 \"
      =259x394\") |\r

      |-----|-----|\r

      \r

      \r

      \r

      ### Sync OAuth claims on every login\r

      \r

      Immich supports OAuth claims for storage quota, the user role, and the preferred username. Up
      until now, those were only synced on registration. \r

      \r

      Now, they can be synced on every login, allowing you to do active user management through your
      IDP, updating quotas and roles as you go and as necessary, and Immich will adopt those
      changes.\r

      \r

      \r

      ### Higher quality thumbnails and previews\r

      \r

      Immich now uses a more accurate image resampling method, improving detail preservation and
      brightness, especially for high contrast details.\r

      \r

      Before\r

      \r

      ![](https://github.com/user-attachments/assets/565b7033-3b44-4988-ad5f-565596b1aa0f \"
      =375x250\")\r

      \r

      After\r

      \r

      ![](https://github.com/user-attachments/assets/2449a36d-8a9f-475c-8f70-f324234738ff \"
      =375x250\")\r

      \r

      \r

      ### Machine learning performance and accuracy improvements (opt-in)\r

      \r

      \r

      > [!NOTE]\r

      > Opt-in to the new machine learning models by adding the following environment variable to
      the machine learning container: `MACHINE_LEARNING_MODEL_REVISION=v2`\r

      \r

      After a long list of optimizations, ML is both significantly faster and uses less memory. This
      affects every backend, including CPU inference. However, the level of improvement varies by
      model and backend. Cases where certain backends (such as OpenVINO) produced wrong outputs at
      times should be resolved.\r

      \r

      RKNPU, used by Rockchip boards, now supports every model in the catalog including OCR for the
      first time, bringing it to parity with other backends. Additionally, TensorRT RTX is now used
      for Ampere (30xx) and newer NVIDIA GPUs, improving performance significantly.\r

      \r

      To fully benefit, set `MACHINE_LEARNING_MODEL_REVISION=v2`to allow more optimized models to be
      downloaded and used. Many of the improvements rely on these optimized models and will not take
      effect when using the old ones. The outputs of the new and old models are numerically
      equivalent, so switching doesn’t require re-running any tasks. This setting will be the
      default in a later release.\r

      \r

      As always, keep in mind that the very first time you load a model requires more preparation
      work, so don’t be surprised if it takes some time at first. This preparation is cached and
      reused, so loading the model will be much faster after the first time.\r

      \r

      ### New OCR models\r

      \r

      The PP-OCRv6 family is now supported. These models are significantly more accurate than the
      previous PP-OCRv5 generation while all being multilingual. PP-OCRv6_tiny is efficient and
      suitable for modest hardware, PP-OCRv6_small is a notable jump in accuracy compared to
      PP-OCRv5_mobile, and PP-OCRv6_medium improves on PP-OCRv5_server as the highest quality and
      most demanding option.\r

      \r

      ### Notable fix: correct storage size on MacOS\r

      \r

      The block size used to calculate the storage capacity and usage has some nuances to it. In
      some situations (*\\**cough*\\** Docker on MacOS \\*cough\\*), we didn’t have enough
      information to correctly compute accurate values. With this release, the reported storage
      usage and capacity should now be correct. \r

      \r

      #### Technical details\r

      \r

      Recent NodeJS releases now expose the `frsize` property, which is sometimes different from
      `bsize` (“block size”). In those cases the calculate storage sizes could often be off by a
      factor of`4096` (or more). In fact, <https://github.com/immich-app/immich/issues/4318> has
      been our fourth oldest open issue (including the renovate dashboard), opened just over three
      years ago. Now, with accurate block sizes our storage calculation should be correct, even in
      Docker on MacOS.\r

      \r

      We are very happy to finally see this issue resolved, even though it only meant a dependency
      bump and a tiny code change for us.\r

      \r

      \r

      As always, please consider supporting the project.\r

      \r

      🎉 Cheers! 🎉\r

      \r

      ## Support Immich\r

      \r

      <p align=\"center\">\r

      \r

      <img
      src=\"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbjY2eWc5Y2F0ZW56MmR4aWE0dDhzZXlidXRmYW\
      Zyajl1bWZidXZpcyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/87CKDqErVfMqY/giphy.gif\"
      width=\"450\" title=\"SUPPORT THE PROJECT!\">\r

      \r

      </p>\r

      \r

      \r

      If you find the project helpful, you can support Immich by purchasing a product key at
      <https://buy.immich.app> or our merchandise at <https://immich.store>\r

      \r

