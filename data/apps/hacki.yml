    body: "## Added\r

      \r

      - Added Material You dynamic colors on Android (contributed by @eames-palmer)\r

      - Added the ability to tap a story tile’s favicon to open its URL\r

      - Added the ability to tap a comment in Time Machine to jump directly to it in the thread\r

      \r

      ## Fixed\r

      \r

      - Fixed new replies notifications\r

      - Fixed janky auto-scroll animation on the thread screen\r

      - Fixed quote button missing on the reply sheet\r

      - Fixed deep links, including iOS cold start and back navigation (contributed by
      @eames-palmer)\r

      - Fixed highlighted text being dropped in comments\r

      - Fixed parsing of embedded URLs in comments\r

      - Improved handling of HN rate limits and countdown banner dismissal\r

      \r

      **Full Changelog**: https://github.com/Livinglist/Hacki/compare/v3.6.7...v3.7.0"
