      * Ability to drag thread navigation buttons to place them anywhere on the screen\r

      * Ability to swipe to vote or open the Time Machine sheet\r

      * Ability to share pins\r

      * Option to skip collapsed comments when using thread navigation buttons\r

      * Separate screen for pins\r

